name: Publish GHCR Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - routes-api

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Push Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image name and tags
        id: vars
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${repo}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

          branch="${GITHUB_REF#refs/heads/}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          # Build the tag list. Only routes-api gets :latest so production
          # can safely pull :latest without risk of getting a main build
          # that lacks the management API.
          echo 'tags<<EOF' >> "$GITHUB_OUTPUT"
          echo "${image}:${branch}" >> "$GITHUB_OUTPUT"
          if [ "$branch" = "routes-api" ]; then
            echo "${image}:latest" >> "$GITHUB_OUTPUT"
          fi
          echo "${image}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          push: true
          platforms: linux/amd64
          build-args: |
            BRANCH=${{ steps.vars.outputs.branch }}
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
